issues_and_notes:
  - The group expanded from six to eight tours to integrate real-hardware execution and real-time logic analysis into the CoreMark learning arc.
...
  - Tours 06 and 08 deliberately teach board selection, console output, and logic-analyzer workflow without teaching distro internals.
...
  - The metadata.ts-generated mechanical sections should remain authoritative for source paths, stop counts, markers, and source snapshots; the curated sections here capture teaching intent.
...
  - Run the repository metadata validator after copying these files into tours/.metadata.
