summary: >
  Begins with a faithful EMS transcription of CoreMark, descends through the shared benchmark infrastructure and its matrix, state-machine, and list-processing algorithms, then moves ActiveRunnerP onto real MCU boards. The final two tours transform CoreMark into the periodic SleepyRunnerP workload and carry PulseView-based real-time analysis from the Pi Pico simulator onto inexpensive logic-analyzer-equipped hardware.
concepts_progression:
  - 102_01 establishes CoreMark, the legacy-C-to-EMS mapping, ActiveRunnerP, timing, and CRC validation.
...
  - 102_02 introduces the common BenchAlgI/CoreBench/Utils/Crc infrastructure shared by the algorithms.
...
  - 102_03 through 102_05 examine MatrixBench, StateBench, and ListBench in increasing source-level depth.
...
  - 102_06 moves the portable ActiveRunnerP workload onto nRF52, nRF54, and TI CC2340R5 hardware and exposes cross-board timing.
...
  - 102_07 transforms burst-oriented ActiveRunnerP into periodic SleepyRunnerP and visualizes wake-work-sleep behavior in PulseView.
...
  - 102_08 reproduces that signal-observation workflow on real hardware with a low-cost eight-channel logic analyzer and live PulseView capture.
...
