overall_assessment: >
  This tour introduces the notion of an explicit pause in execution flow,
  contrasting continuous activity with deliberate gaps. The key insight is
  recognizing absence of activity in the waveform as meaningful behavior,
  not just “nothing happening.”

learning_objectives:
  - Introduce pause as a first-class behavioral element
  - Recognize inactivity regions in waveform
  - Understand how pauses are encoded in EMS code
  - Relate absence of transitions to execution intent

concepts_introduced:
  - pause behavior
  - inactivity windows
  - gaps in waveform
  - temporal spacing of events

concepts_reinforced:
  - PulseView
  - wokwi.vcd
  - BusyWait timing
  - BoardC signal mapping
  - code ↔ waveform mapping

