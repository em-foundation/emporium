overall_assessment: >
  This tour introduces AlarmMgr as a more precise and structured alternative
  to BusyWait-based timing. The key shift is from blocking delays to scheduled
  wakeups, which results in cleaner, more predictable timing visible in the
  waveform.

learning_objectives:
  - Introduce AlarmMgr as a scheduling mechanism
  - Replace BusyWait delays with wakeup-based timing
  - Understand delta-based wakeup semantics
  - Observe periodic behavior driven by alarms

