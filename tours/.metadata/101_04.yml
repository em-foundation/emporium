overall_assessment:
  summary: Demonstrates OneShot delegate for timed sleep and interrupt-driven wakeup, contrasting fiber-based and super-loop implementations.
  difficulty: intermediate
  key_takeaway: Timer-driven callbacks enable efficient sleep/wakeup without busy-waiting.

learning_objectives:
  - understand OneShot delegate usage
  - distinguish fiber vs super-loop execution
  - interpret interrupt-driven wakeup behavior
  - observe and measure latency via debug signals

concepts_introduced:
  - OneShot delegate
  - OneShotI interface
  - timer interrupt callback
  - interrupt latency
  - done_flag synchronization

concepts_reinforced:
  - FiberMgr scheduling
  - Idle sleep behavior
  - Composite binding (BoardC)
  - debug signal measurement

prerequisites:
  - 101_01
  - 101_02
  - 101_03

stop_count: 9

stops:
  - id: 1
    title: OneShotP – Timer Events
    focus: introduce timer-based sleep
    teaching_intent: replace busy wait with OneShot delay
    concepts:
      - OneShot delegate
    user_takeaway: can sleep for fixed time without spinning

  - id: 2
    title: OneShot2P – Details
    focus: fiber-based implementation
    teaching_intent: show callback rescheduling via FiberMgr
    concepts:
      - FiberMgr
      - callback repost
    user_takeaway: execution resumes via timer callback

  - id: 3
    title: OneShotI – Details
    focus: interface abstraction
    teaching_intent: explain OneShot interface contract
    concepts:
      - $declare('INTERFACE')
    user_takeaway: behavior defined abstractly

  - id: 4
    title: BoardC – A Quick Look
    focus: concrete binding
    teaching_intent: show board-provided implementation
    concepts:
      - Composite binding
    user_takeaway: platform supplies implementation

  - id: 5
    title: OneShot2P – Build · Load
    focus: runtime behavior
    teaching_intent: observe interrupt-driven execution
    concepts:
      - interrupt handler
    user_takeaway: wakeup triggered by timer interrupt

  - id: 6
    title: OneShot2P – Signal Capture
    focus: timing analysis
    teaching_intent: measure latency using debug pins
    concepts:
      - latency measurement
    user_takeaway: wakeup delay is observable

  - id: 7
    title: OneShot1P – Details
    focus: super-loop model
    teaching_intent: contrast with fiber approach
    concepts:
      - done_flag
      - polling loop
    user_takeaway: requires explicit synchronization

  - id: 8
    title: OneShot1P – Extra Credit
    focus: experimentation
    teaching_intent: compare implementations
    concepts:
      - performance comparison
    user_takeaway: tradeoffs can be measured

  - id: 9
    title: Next Steps
    focus: continuation
    teaching_intent: prepare for next tour
    concepts:
      - interface reuse
    user_takeaway: OneShot will be reused later

issues_and_notes:
  - relies on screenshots for latency visualization
  - emphasizes energy-efficient sleep over busy-wait
