overall_assessment:
  summary: Introduces Ticker as a higher-level abstraction built on AlarmMgr for periodic execution, simplifying recurring scheduling patterns.
  difficulty: intermediate
  key_takeaway: Ticker encapsulates periodic wakeup behavior, eliminating the need to manually reschedule alarms.

learning_objectives:
  - understand Ticker as a periodic scheduling abstraction
  - see how Ticker builds on AlarmMgr
  - observe repeated callbacks without explicit rescheduling
  - relate periodic execution to signal traces

concepts_introduced:
  - Ticker
  - periodic scheduling
  - recurring callbacks

concepts_reinforced:
  - AlarmMgr
  - wakeupAligned
  - FiberMgr
  - signal capture
  - code-to-signal mapping

prerequisites:
  - 101_06

stop_count: 6

stops:
  - id: 1
    title: "Ticker"
    focus: periodic abstraction
    teaching_intent: introduce Ticker as a simplified way to express recurring timed behavior
    concepts:
      - Ticker
      - periodic execution
    user_takeaway: Ticker provides a cleaner model for repeated actions than manually chaining alarms

  - id: 2
    title: "%[cu]TickerP% &ndash; Details"
    focus: ticker construction
    teaching_intent: show how a Ticker instance is created and configured using EMS patterns
    concepts:
      - "$config"
      - Ticker object
      - callback binding
    user_takeaway: A Ticker is configured once and drives repeated callbacks automatically

  - id: 3
    title: "%[cu]TickerP% &ndash; Operation"
    focus: runtime behavior
    teaching_intent: explain how Ticker internally schedules periodic wakeups using AlarmMgr
    concepts:
      - AlarmMgr
      - wakeupAligned
      - scheduling loop
    user_takeaway: Ticker internally handles rescheduling using aligned wakeups

  - id: 4
    title: "%[cu]TickerP% &ndash; Signal Capture"
    focus: visualization
    teaching_intent: demonstrate periodic behavior through waveform traces
    concepts:
      - PulseView
      - periodic signals
      - timing intervals
    user_takeaway: The waveform shows consistent, evenly spaced wakeups driven by Ticker

  - id: 5
    title: " Extra Credit"
    focus: experimentation
    teaching_intent: encourage modifying timing parameters and observing changes in periodic behavior
    concepts:
      - interval tuning
      - signal variation
    user_takeaway: Adjusting Ticker parameters directly affects observed timing

  - id: 6
    title: " Next Steps"
    focus: continuation
    teaching_intent: prepare for more advanced coordination of timed activities
    concepts:
      - multi-rate systems
      - scheduling composition
    user_takeaway: Ticker is a building block for more complex timed systems

issues_and_notes:
  - titles preserved exactly from .emtour
