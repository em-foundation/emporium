overall_assessment: >
  Introduces EMS debug/RTA in a concrete way. The tour ties source constructs
  directly to observable signals (pins + UART) and makes failure behavior
  visible. Strong bridge from simple waveform viewing to purposeful
  instrumentation.

learning_objectives:
  - Understand DebugP as a vehicle for EMS debug features
  - Observe fail/halt behavior in hardware signals
  - Use '%%[p...]' and '%%>' for low-overhead instrumentation
  - Correlate UART output and debug pins with execution
  - Recognize portability via the Debug module

concepts_introduced:
  - DebugP
  - fail
  - halt
  - "%%[p...] pin instrumentation"
  - "%%> UART binary output"
  - dbgFlag
  - DbgA
  - DbgB
  - DbgC
  - DbgD
  - real-time analysis (RTA)
  - Debug module (portable implementation)

concepts_reinforced:
  - PulseView
  - wokwi.vcd
  - BoardC signal mapping
  - AppLed
  - SysLed
  - BusyWait timing
  - code ↔ waveform mapping

prerequisites:
  - 101_01

stop_count: 9

stops:
  - stop: 1
    focus: DebugP overview
    teaching_intent: Introduce DebugP and position it beyond printf-style debug
    concepts:
      - DebugP
      - printf subset
    user_takeaway: EMS provides lightweight, deployable debug mechanisms

  - stop: 2
    focus: build·load expectations
    teaching_intent: Set expectations for LED behavior and eventual failure
    concepts:
      - AppLed
      - SysLed
      - fail
    user_takeaway: Behavior changes over time and ends with a visible failure

  - stop: 3
    focus: core debug statements
    teaching_intent: Explain pin assertions, timing marks, config gating, and fail
    concepts:
      - Dbg pins
      - dbgFlag
      - fail
    user_takeaway: Code can mark timing and conditionally enable debug

  - stop: 4
    focus: binary output + pin toggling
    teaching_intent: Show '%%>' UART output and '%%[p...]' pin activity
    concepts:
      - "%%>"
      - "%%[p...]"
      - cnt
      - bits11
    user_takeaway: EMS supports compact, deterministic debug outputs

  - stop: 5
    focus: signal capture
    teaching_intent: Map waveform features to runtime events and debug activity
    concepts:
      - UART traces
      - active-low pins
      - fail marker
    user_takeaway: All debug activity is visible in the waveform

  - stop: 6
    focus: debug model comparison
    teaching_intent: Contrast printf, fail/halt, and RTA primitives
    concepts:
      - overhead
      - determinism
    user_takeaway: EMS debug is designed for real embedded use

  - stop: 7
    focus: portable implementation
    teaching_intent: Show how debug intrinsics map to the Debug module
    concepts:
      - translator replacement
      - runtime functions
    user_takeaway: Special syntax compiles to normal portable code

  - stop: 8
    focus: extra credit
    teaching_intent: Encourage exploration with PulseView and Console.print
    concepts:
      - cursors
      - Console
    user_takeaway: I can extend and experiment with debug features

  - stop: 9
    focus: next steps
    teaching_intent: Position RTA and UART output for upcoming tours
    concepts:
      - RTA workflow
    user_takeaway: These tools will be used throughout the series

issues_and_notes:
