overall_assessment: Strong second tour in the Basic Examples series. It keeps the waveform-analysis workflow from 101_01 but introduces EMS debugging and real-time-analysis features with much lower overhead than printf alone. The tour balances source-level constructs, signal-level interpretation in PulseView, and the portable runtime implementation behind the debug intrinsics.
learning_objectives:
- Introduce EMS real-time debug capabilities through DebugP
- Show how fail and halt become observable board-level behavior
- Explain lightweight debug statements that drive pins and UART output
- Use PulseView to correlate DebugP source with captured runtime signals
- Reveal the portable Debug module that implements %%[p...] statements
- Position EMS debug/RTA features as practical even in deployed code
concepts_introduced:
- DebugP
- fail statement
- halt statement
- '%%[p...] debug statements'
- '%%> UART binary output'
- dbgFlag config parameter
- DbgA/DbgB/DbgC/DbgD pins
- real-time analysis (RTA)
- portable Debug module
concepts_reinforced:
- PulseView
- wokwi.vcd
- AppLed
- SysLed
- BoardC
- Common.BusyWait.wait
- printf as practical subset
- code-to-waveform mapping
prerequisites:
- '101_01'
stop_count: 9
stops:
- stop: 1
  focus: DebugP overview
  teaching_intent: Introduce DebugP as a program that demonstrates EMS debug features beyond printf
  concepts:
  - DebugP
  - printf
  - embedded debug capabilities
  user_takeaway: EMS provides lightweight debugging mechanisms that can remain in deployed applications.
- stop: 2
  focus: Build·Load expectations
  teaching_intent: Prepare the user to observe mixed LED behavior and an abrupt failure before examining the signal capture
  concepts:
  - AppLed
  - SysLed
  - fail
  - PulseView motivation
  user_takeaway: DebugP starts like a blinker, then fails in a visibly distinct way that is best understood in PulseView.
- stop: 3
  focus: DebugP details
  teaching_intent: Explain four debug-related statements in the main loop, especially pin assertion, timing measurement, config-gated debug code, and fail
  concepts:
  - DbgD assert
  - DbgA de-assert
  - dbgFlag config
  - fail statement
  user_takeaway: Specific EMS statements can mark timing, gate debug code, and explicitly abort the program.
- stop: 4
  focus: More details
  teaching_intent: Explain efficient binary output and pin-toggling debug statements driven by cnt and bits11
  concepts:
  - '%%> cnt binary output'
  - '%%> bits11 binary output'
  - '%%c: pin toggling'
  - expression e+1 semantics
  user_takeaway: EMS supports very small, deterministic debug outputs to UART and pins.
- stop: 5
  focus: Signal capture
  teaching_intent: Correlate PulseView signals with DebugP runtime events, including fail, UART payloads, and active-low debug pins
  concepts:
  - 2 MHz AppLed toggling
  - 200 MHz SysLed fail marker
  - UART values for cnt and bits11
  - DbgC quick toggles
  - active-low logic
  user_takeaway: The waveform makes the fail event and all debug outputs directly visible in time.
- stop: 6
  focus: Still more details
  teaching_intent: Contrast printf, fail/halt, %%> and %%[p...] in terms of practicality and run-time overhead
  concepts:
  - printf subset
  - halt statement
  - deterministic overhead
  - factory/field testing
  user_takeaway: EMS debug intrinsics are intentionally lightweight enough for practical run-time use.
- stop: 7
  focus: Portable implementation
  teaching_intent: Show the portable Debug module that the translator targets when replacing %%[p...] statements
  concepts:
  - Debug module
  - translator replacement
  - runtime helper functions
  - Console peer module
  user_takeaway: The special debug statements compile down to ordinary runtime functions in a portable module.
- stop: 8
  focus: Extra credit
  teaching_intent: Encourage exploration of timings, Console.print, and adding RTA intrinsics to user code
  concepts:
  - PulseView cursors
  - Console.print
  - user experimentation
  user_takeaway: I can now measure, inspect, and add these debug features to my own programs.
- stop: 9
  focus: Next steps
  teaching_intent: Frame the remaining Basic Examples tours as using %%[p] for low-overhead RTA and %%> for efficient UART output
  concepts:
  - RTA
  - production-friendly instrumentation
  - test what you fly
  user_takeaway: These EMS debug features are meant for real embedded workflows, not just temporary scaffolding.
