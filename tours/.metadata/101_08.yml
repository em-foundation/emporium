overall_assessment:
  summary: Consolidates prior timing concepts by exposing AlarmMgr directly, showing how multiple alarms are coordinated over a shared time base.
  difficulty: intermediate
  key_takeaway: AlarmMgr is the underlying scheduler that enables both one-shot and periodic timing patterns in EMS.

learning_objectives:
  - understand AlarmMgr as the central timing coordinator
  - see how multiple alarms coexist and are scheduled
  - observe ordering and interaction of scheduled events
  - relate scheduling behavior to captured signals

concepts_introduced:
  - AlarmMgr (direct usage)
  - multi-alarm coordination
  - shared time base
  - event ordering

concepts_reinforced:
  - Alarm
  - wakeup
  - wakeupAligned
  - Ticker
  - FiberMgr
  - signal capture
  - code-to-signal mapping

prerequisites:
  - 101_06
  - 101_07

stop_count: 6

stops:
  - id: 1
    title: "AlarmMgr"
    focus: scheduler overview
    teaching_intent: introduce AlarmMgr as the core runtime component managing all alarms
    concepts:
      - AlarmMgr
      - scheduler
    user_takeaway: AlarmMgr is the foundation for all timed behavior in EMS

  - id: 2
    title: "%[cu]AlarmMgrP% &ndash; Details"
    focus: manager structure
    teaching_intent: show how AlarmMgr instances are created and how alarms are registered
    concepts:
      - "$config"
      - AlarmMgr object
      - alarm registration
    user_takeaway: AlarmMgr maintains and tracks multiple alarm objects

  - id: 3
    title: "%[cu]AlarmMgrP% &ndash; Scheduling"
    focus: scheduling behavior
    teaching_intent: explain how AlarmMgr determines which alarm fires next based on time
    concepts:
      - scheduling queue
      - next-event selection
      - time comparison
    user_takeaway: AlarmMgr selects the next wakeup event based on earliest scheduled time

  - id: 4
    title: "%[cu]AlarmMgrP% &ndash; Signal Capture"
    focus: visualization
    teaching_intent: demonstrate how multiple alarms appear in waveform traces
    concepts:
      - PulseView
      - overlapping signals
      - timing interactions
    user_takeaway: Multiple scheduled events can be observed and correlated in signal captures

  - id: 5
    title: " Extra Credit"
    focus: experimentation
    teaching_intent: encourage modifying alarm timing and observing scheduling effects
    concepts:
      - timing variation
      - scheduling impact
    user_takeaway: Changing alarm parameters affects ordering and interaction of events

  - id: 6
    title: " Next Steps"
    focus: continuation
    teaching_intent: transition toward more complex runtime coordination patterns
    concepts:
      - system composition
      - advanced scheduling
    user_takeaway: AlarmMgr enables scalable coordination of timed activities

issues_and_notes:
  - titles preserved exactly from .emtour
  - understanding improves with waveform inspection
