overall_assessment:
  summary: Explains the EM•Script content hierarchy (packages, buckets, units) and how source files are organized and extended within the workspace.
  difficulty: introductory
  key_takeaway: Understand how EMS code is structured and how to navigate and extend the content model.

learning_objectives:
  - understand EMS hierarchy: package, bucket, unit
  - recognize how source files map to EMS units
  - navigate EMS content within the workspace
  - add and modify EMS source files
  - understand role of source control

concepts_introduced:
  - package
  - bucket
  - unit
  - EMS namespace structure
  - content organization

concepts_reinforced:
  - workspace navigation
  - VS Code file structure
  - EMS code organization

prerequisites:
