issues_and_notes:
  - The group deliberately moves from the portable application boundary downward into increasingly hardware-specific distro implementation details, then returns to a cross-platform comparison in the final gallery.
  - Raspberry Pi RP2040 is used for several detailed implementation walkthroughs, while Nordic nRF52 and TI CC23xx provide parallel implementations and comparison points throughout the group.
  - SleepyRunnerP from the CoreMark tour group is reused as a concrete workload for the deep-sleep walkthrough; understanding the full CoreMark internals is not required for this group.
  - The metadata.ts-generated per-tour files remain authoritative for source paths, stop counts, markers, and source snapshots; this group file captures sequence-level teaching intent.
