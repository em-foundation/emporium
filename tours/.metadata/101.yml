summary:
  The Basic Examples tours introduce core EMS runtime patterns through small,
  observable programs. The sequence begins with simple blinking and debug
  instrumentation, then moves through fibers, one-shot timers, pausing,
  wakeup alarms, periodic scheduling, real-time clock use, edge detection,
  and higher-level button handling. Across the group, the emphasis stays on
  relating EMS abstractions to concrete behavior visible in build output and
  signal capture.

concepts_progression:
  - simple blinking behavior and basic timing
  - debug instrumentation with pins and UART
  - cooperative scheduling with FiberMgr
  - one-shot timers and wakeup latency
  - pausing and polling-based waiting
  - alarm-driven wakeups against a real-time clock
  - periodic scheduling with ticker-style abstractions
  - time-based coordination and clock-aware behavior
  - asynchronous input through edge detection
  - higher-level button abstractions built on lower-level interfaces

