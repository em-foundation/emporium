overall_assessment: Strong first tour in the Basic Examples series. It reuses the already-familiar BlinkerP program, adds a few language details, and then pivots to real-time analysis with PulseView. The tour works as a bridge from orientation-level code reading to waveform-based execution analysis.
learning_objectives:
- Reconnect the user with BlinkerP as the baseline example
- Reinforce a handful of EMS/TS syntax and naming details already encountered
- Introduce PulseView as the main real-time analysis tool for the Basic Examples series
- Show how Wokwi captures signals and how PulseView imports and displays them
- Tie observed D0–D7 waveforms back to BoardC and runtime behavior
- Position the rest of the Basic Examples series as waveform-driven variants on BlinkerP
concepts_introduced:
- PulseView
- real-time analysis
- wokwi.vcd
- Wokwi LOGIC capture
- signal capture of D0–D7
- halt-visible shutdown signaling
concepts_reinforced:
- BlinkerP
- BoardC
- Common
- AppLed
- current-board bucket naming via '@$distro'
- $delegate
- em$run
- leading underscore convention
- numeric separators in TS/EMS
- $clone
- em$configure
- $board
prerequisites:
- '100_01'
