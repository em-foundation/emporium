overall_assessment:
  summary: Introduces a simple blinking application to demonstrate timing, hardware interaction, and the EMS execution model.
  difficulty: introductory
  key_takeaway: Understand how EMS code drives periodic hardware behavior.

learning_objectives:
  - understand basic EMS program structure
  - observe timing behavior using BusyWait
  - connect code execution to hardware output
  - build and run EMS applications

concepts_introduced:
