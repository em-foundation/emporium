  - HelloP UART capture
  - zgit.* program captures
  user_takeaway: I can start using PulseView on other EMS programs, not just the tutorial example.
- stop: 8
  focus: Next steps
  teaching_intent: Frame the rest of the Basic Examples tours as waveform-focused variants of BlinkerP
  concepts:
  - Basic Examples series
  - portable units
  - PulseView as analysis lens
  user_takeaway: The novelty of the next tours lies in execution analysis, not just surface code changes.
