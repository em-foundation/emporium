  - pin_num config
  - $board
  - em-boards
  user_takeaway: The visible PulseView channels originate in BoardC wiring and board-specific binding.
- stop: 6
  focus: BlinkerP signal capture
  teaching_intent: Interpret the actual waveform produced by BlinkerP over several seconds
  concepts:
  - SysLed startup wink
  - BusyWait timing
  - halt signaling
  - AppOut
  - program shutdown
  user_takeaway: The waveform makes startup, steady blinking, and shutdown behavior directly observable.
- stop: 7
  focus: Extra credit
  teaching_intent: Encourage independent use of PulseView beyond the scripted walkthrough
  concepts:
