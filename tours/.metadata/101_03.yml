overall_assessment: >
  This tour introduces fibers as a core EMS execution mechanism. It shifts the
  focus from simple timing patterns to structured, cooperative execution. The
  screenshots and code together demonstrate how multiple logical flows are
  interleaved without traditional threading, and how that behavior appears in
  the waveform.

learning_objectives:
  - Introduce the concept of fibers in EMS
  - Show how fibers enable cooperative concurrency
  - Relate fiber execution to observable waveform behavior
  - Contrast fiber-based flow with simple linear blinking loops
  - Build intuition for interleaved execution

concepts_introduced:
  - fiber
  - cooperative concurrency
  - interleaved execution
  - yield points (implicit via waits)
  - multiple logical flows in a single thread

concepts_reinforced:
  - PulseView
  - wokwi.vcd
  - BusyWait timing
  - BoardC signal mapping
  - code ↔ waveform correlation

